    { name = "lkienkle1102", email = "lkienkle1102@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "fastapi-users[sqlalchemy]==15.0.5",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.12",
